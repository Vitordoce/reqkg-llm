# Neo4j do protótipo ReqKG-LLM.
# Credenciais vêm do arquivo .env (copie de .env.example). O .env não entra no pacote de entrega.
# NEO4J_AUTH só vale na primeira subida do volume. Para trocar a senha depois,
# rode `make neo4j-rotate-password`, que troca dentro do banco sem apagar o volume.
name: reqkg-llm

services:
  neo4j:
    # Série 5.26 LTS, Community. Tag e digest do índice multiarquitetura fixados.
    image: neo4j:5.26.31-community@sha256:c7d25c0eeebfe125718d58b72ed5d663c85d0479047733845eb2237c67ce8069
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-17687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:?defina NEO4J_USER no .env}/${NEO4J_PASSWORD:?defina NEO4J_PASSWORD no .env}"
    volumes:
      - neo4j-data:/data
    healthcheck:
      # Sem senha: um healthcheck autenticado com a senha da criação do container falha depois de
      # uma troca de senha e mantém o banco em AuthenticationRateLimit.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7474 && printf \"GET / HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 15s
      retries: 30
      start_period: 20s

volumes:
  neo4j-data:
